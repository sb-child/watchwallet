[[evm]]
chain_name = "Ethereum Mainnet"
ws_url = "wss://eth-mainnet.g.alchemy.com/v2/YOUR_API_KEY"
coin = "ETH"
# 是否监听原生币转账。需要为每个新区块拉取完整区块，出块快的链可以设为 false。
native_transfer = true
[[evm.address]]
name = "first wallet"
addr = "0x"
